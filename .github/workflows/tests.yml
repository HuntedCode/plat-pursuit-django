name: tests

# Runs the pytest suite on every push to main and on every pull request.
# Once a branch-protection rule requires this check, a red run blocks merging
# into main, so failing tests can't reach Render (which deploys from main).
#
# No secrets needed: CI spins up its own Postgres + Redis service containers and
# uses settings_test, which requires no real API keys.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: plat_pursuit_dev
          POSTGRES_USER: plat_user
          POSTGRES_PASSWORD: securepass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U plat_user -d plat_pursuit_dev"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379

    env:
      # Point settings_test at the CI service containers (on localhost).
      TEST_DB_HOST: localhost
      TEST_DB_PORT: "5432"
      TEST_DB_NAME: plat_pursuit_dev
      TEST_DB_USER: plat_user
      TEST_DB_PASSWORD: securepass
      TEST_REDIS_URL: redis://localhost:6379/15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # JS lint. Runs BEFORE the Python suite because it takes seconds and answers a question the
      # suite structurally cannot: `game-flag.js` once shipped with a variable used in four places
      # and declared in none -- valid JavaScript, so the build, collectstatic and every Django test
      # passed while a button silently did nothing in the browser. See eslint.config.mjs.
      # Node 22 (LTS), matching local. 20 is deprecated on GitHub's runners as of 2025-09.
      # `cache: npm` keys on package-lock.json, which is committed -- it hard fails without one.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # `npm ci`, which installs EXACTLY the locked tree and refuses if package.json and the lockfile
      # disagree. That refusal is the point: CI used to re-resolve the whole transitive dependency
      # graph from the network on every run and execute its install scripts, so a patch release
      # anywhere in the tree landed on the runner unreviewed. The lockfile pins exact tarballs with
      # integrity hashes; `ci` is what honours them.
      - name: Install JS dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint JS
        run: npm run lint

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # The share-card layout tests measure a real render in a real browser, because that class of
      # bug (a fixed-canvas card silently clipping its own title) cannot be caught by asserting on
      # markup -- it is a question about pixels. The pip package ships with requirements; the browser
      # binary does not, so without this the tests fail on a missing executable.
      #
      # Cached on the pinned playwright version, so this downloads once per version bump rather than
      # once per run.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-1.51.0

      - name: Install Playwright chromium
        run: python -m playwright install --with-deps chromium

      # THE TEST DATABASE IS BUILT ONCE AND COPIED, not built by every worker. Each pytest-xdist worker needs its
      # own database (`test_<name>_gw<N>`), and on a fresh runner each one ran every migration itself, all four
      # at once on four cores: the first measured run spent 4m05s building databases and 3m40s running tests.
      # Here the migrations run once, Postgres copies the result per worker (`createdb -T` is a file copy,
      # seconds), and the workers find their databases already there (`--reuse-db` is in pyproject's addopts).
      - name: Build the test database once
        run: |
          python -c "import os, django; os.environ.setdefault('DJANGO_SETTINGS_MODULE', 'plat_pursuit.settings_test'); django.setup(); from django.test.utils import setup_databases; setup_databases(verbosity=1, interactive=False, keepdb=True)"
          for n in 0 1 2 3; do
            PGPASSWORD="$TEST_DB_PASSWORD" createdb -h "$TEST_DB_HOST" -p "$TEST_DB_PORT" -U "$TEST_DB_USER" -T "test_$TEST_DB_NAME" "test_${TEST_DB_NAME}_gw$n"
          done

      # FOUR WORKERS, matching the four copies above (and the runner's four cores). The suite is ~7,500 tests at
      # ~0.1s each, nearly all database setup, so it is bound by being run one at a time rather than by any slow
      # test: locally 12 workers took it from 12 minutes to 2. The Django cache is in-memory per process, so
      # workers share nothing.
      - name: Run tests
        run: pytest -n 4
