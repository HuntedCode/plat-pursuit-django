name: tests

# Runs the pytest suite on every push to main and on every pull request.
# Once a branch-protection rule requires this check, a red run blocks merging
# into main, so failing tests can't reach Render (which deploys from main).
#
# No secrets needed: CI spins up its own Postgres + Redis service containers and
# uses settings_test, which requires no real API keys.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: plat_pursuit_dev
          POSTGRES_USER: plat_user
          POSTGRES_PASSWORD: securepass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U plat_user -d plat_pursuit_dev"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379

    env:
      # Point settings_test at the CI service containers (on localhost).
      TEST_DB_HOST: localhost
      TEST_DB_PORT: "5432"
      TEST_DB_NAME: plat_pursuit_dev
      TEST_DB_USER: plat_user
      TEST_DB_PASSWORD: securepass
      TEST_REDIS_URL: redis://localhost:6379/15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # JS lint. Runs BEFORE the Python suite because it takes seconds and answers a question the
      # suite structurally cannot: `game-flag.js` once shipped with a variable used in four places
      # and declared in none -- valid JavaScript, so the build, collectstatic and every Django test
      # passed while a button silently did nothing in the browser. See eslint.config.mjs.
      # NO `cache: npm`. It keys the cache on a lockfile and HARD FAILS without one -- "Dependencies
      # lock file is not found" -- which is the same package-lock.json-is-gitignored constraint that
      # rules out `npm ci` below, in a place that looks unrelated. Three devDependencies install in
      # seconds anyway; there is nothing here worth caching.
      #
      # Node 22 (LTS), matching local. 20 is deprecated on GitHub's runners as of 2025-09.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # `npm install`, not `npm ci`: package-lock.json is gitignored in this repo (npm is a local
      # tool here -- Tailwind runs through npx), so there is no lockfile for `ci` to read. The
      # determinism `ci` would give comes from EXACT versions in package.json instead: without them
      # a future eslint patch could add a rule and turn CI red with no code change. If the lockfile
      # is ever committed, switch this back.
      - name: Install JS dependencies
        run: npm install --no-audit --no-fund

      - name: Lint JS
        run: npm run lint

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # The share-card layout tests measure a real render in a real browser, because that class of
      # bug (a fixed-canvas card silently clipping its own title) cannot be caught by asserting on
      # markup -- it is a question about pixels. The pip package ships with requirements; the browser
      # binary does not, so without this the tests fail on a missing executable.
      #
      # Cached on the pinned playwright version, so this downloads once per version bump rather than
      # once per run.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-1.51.0

      - name: Install Playwright chromium
        run: python -m playwright install --with-deps chromium

      - name: Run tests
        run: pytest
