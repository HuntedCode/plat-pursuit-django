version: 2
updates:
  # Version updates: one grouped PR a month per ecosystem with every minor and patch update,
  # reviewed in the monthly dependency review (a reminder issue opens on the 2nd). Major updates
  # come as their own PRs, so one breaking upgrade cannot hold back the rest. Security updates
  # arrive as their own PRs as soon as an advisory is published (enabled in the repository
  # settings). See docs/guides/security.md (Dependency Advisories).

  # requirements.txt is fully pinned, transitive dependencies included. CI's "Check the Python
  # pins" step fails a bump that needs a new or changed transitive pin.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    # Room for every pending major to have its own PR (the default is 5). Security PRs have a
    # separate limit and are unaffected.
    open-pull-requests-limit: 10
    groups:
      # Date-versioned packages look like a major update every year. certifi (the CA bundle) and
      # tzdata matter, so they ride the monthly group whatever the version jump. A package matches
      # the first group that fits, so this one comes first.
      pip-date-versioned:
        patterns: [certifi, tzdata, pytz, packaging, pycountry]
      pip-monthly:
        patterns: ['*']
        update-types: [minor, patch]
    commit-message:
      prefix: chore(deps)

  # npm is build-only (Tailwind and ESLint); the image never runs it.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      npm-monthly:
        patterns: ['*']
        update-types: [minor, patch]
    commit-message:
      prefix: chore(deps)

  # GitHub Actions: keep workflow actions current, since they run with repository access.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions-monthly:
        patterns: ['*']
        update-types: [minor, patch]
    commit-message:
      prefix: chore(ci)
