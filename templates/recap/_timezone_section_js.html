{% load static %}
{% comment %}
Wiring only. The zone list, browser detection and save path all live in `timezone-picker.js`, because the
first-run modal needs the same three things and a second copy of any of them would be a second thing to
keep correct.
{% endcomment %}
<script src="{% static 'js/timezone-picker.js' %}"></script>
<script>
(function () {
    const TZ = PlatPursuit.TimezonePicker;
    const select = document.getElementById('recap-timezone-select');
    if (!select || !TZ) { return; }

    const currentTz = select.dataset.current;
    TZ.populate(select, currentTz);

    async function commit(tz) {
        select.disabled = true;
        try {
            const result = await TZ.save(tz);
            // The page around this control was built from the OLD boundaries -- every month tile, the
            // hero, the counts. Reloading is the honest response to changing what a month means.
            const msg = result.recaps_reset > 0
                ? 'Timezone updated. Your recaps will regenerate with the new timezone.'
                : 'Timezone updated.';
            PlatPursuit.ToastManager.success(msg + ' Reloading...');
            setTimeout(function () { window.location.reload(); }, 1500);
        } catch (err) {
            PlatPursuit.ToastManager.error(err.message);
            select.value = currentTz;
            select.disabled = false;
        }
    }

    select.addEventListener('change', function () {
        if (select.value !== currentTz) { commit(select.value); }
    });

    // "Your browser says somewhere else" -- offered inline, since someone who scrolled to this row is
    // already thinking about the setting.
    const browserTz = TZ.detect();
    if (browserTz && browserTz !== currentTz) {
        const container = document.getElementById('tz-hint-container');
        if (container) {
            const hint = document.createElement('p');
            hint.className = 'text-xs text-warning mt-2';
            hint.innerHTML = 'Your browser reports <strong>'
                + PlatPursuit.HTMLUtils.escape(browserTz.replace(/_/g, ' '))
                + '</strong>. <button type="button" class="link link-warning text-xs font-semibold" '
                + 'id="tz-use-browser-btn">Use this instead?</button>';
            container.appendChild(hint);
            document.getElementById('tz-use-browser-btn')
                .addEventListener('click', function () { commit(browserTz); });
        }
    }
})();
</script>
